<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @page {
            size: letter;
            margin: 0.5in;
        }
        .coupon-page {
            page-break-after: always;
            text-align: center;
            padding: 20px;
        }
        .coupon-page:last-child {
            page-break-after: auto;
        }
        .coupon-image {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    {% for img_data in coupon_images %}
    <div class="coupon-page">
        <img class="coupon-image" src="data:image/png;base64,{{ img_data }}" alt="Coupon">
    </div>
    {% endfor %}
</body>
</html>
